<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Port Forwarder</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header>
    <h1>Port Forwarder</h1>
    <span id="conn-status" class="badge">connecting…</span>
  </header>

  <main>
    <section class="panel">
      <h2>添加规则</h2>
      <form id="add-form" autocomplete="off">
        <label>名称
          <input id="name" name="name" placeholder="e.g. http-dev" required />
        </label>
        <label>监听地址
          <input id="listen" name="listen" placeholder="e.g. :8080" required />
        </label>
        <label>目标地址
          <input id="target" name="target" placeholder="e.g. 127.0.0.1:3000" required />
        </label>
        <button type="submit" class="primary">添加</button>
      </form>
    </section>

    <section class="panel">
      <h2>规则列表</h2>
      <div id="rules"></div>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
